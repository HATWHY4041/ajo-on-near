name: Contracts

on:
  push:
    branches: [main]
    paths: ["contract/**", "token/**", ".github/workflows/contract.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Unit tests (Ajo contract)
        working-directory: contract
        run: cargo test

      - name: Unit tests (test stablecoin)
        working-directory: token
        run: cargo test

      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh

      - name: Build Ajo wasm
        working-directory: contract
        run: |
          mkdir -p res
          set -o pipefail
          cargo near build non-reproducible-wasm 2>&1 | tee res/build.log

      - name: Build token wasm
        working-directory: token
        run: |
          mkdir -p res
          set -o pipefail
          cargo near build non-reproducible-wasm 2>&1 | tee res/build.log

      - name: Commit build output
        if: always()
        run: |
          for d in contract:ajo_on_near token:ajo_test_token; do
            dir=${d%%:*}; name=${d##*:}
            mkdir -p $dir/res
            if [ -f $dir/target/near/$name.wasm ]; then
              cp $dir/target/near/$name.wasm $dir/res/
              cp $dir/target/near/${name}_abi.json $dir/res/ 2>/dev/null || true
              (cd $dir && sha256sum res/$name.wasm > res/$name.wasm.sha256)
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contract/res token/res
          git diff --cached --quiet || git commit -m "Build contract wasm [skip ci]"
          git push
