[package]
name = "ajo-test-token"
version = "0.1.0"
edition = "2021"
description = "Test stablecoins for Ajo on NEAR testnet (tUSDC, tUSDT): NEP-141 with a faucet and test-rate conversion"
license = "MIT"
repository = "https://github.com/HATWHY4041/ajo-on-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
